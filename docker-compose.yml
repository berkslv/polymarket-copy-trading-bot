services:
  mongodb:
    image: mongo:7
    container_name: polymarket-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: polymarket_copy_bot
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - polymarket-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polymarket-copy-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/polymarket_copy_bot
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - polymarket-net

volumes:
  mongo_data:
    name: polymarket_mongo_data

networks:
  polymarket-net:
    name: polymarket-net
